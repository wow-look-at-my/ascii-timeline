name: CI

on:
  push:
    branches: ['**']

permissions:
  id-token: write # OIDC: secret server + buildhost publish
  actions: read # buildhost-publish lists + downloads the build artifact
  contents: write # dependency-graph submission (and releases)
  checks: read # the no-all-builds guard scans the head commit's check runs
  deployments: write # autorelease registers each publish as a Deployment
  artifact-metadata: write # autorelease records the upload on the artifacts page

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master
